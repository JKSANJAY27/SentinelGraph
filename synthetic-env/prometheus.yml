global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8011"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8012"]

  - job_name: "payment-service"
    static_configs:
      - targets: ["payment-service:8013"]
