version: '3.8'

services:
  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8011:8011"
    networks:
      - sentinel-net

  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8012:8012"
    environment:
      - USER_SERVICE_URL=http://user-service:8011
      - PAYMENT_SERVICE_URL=http://payment-service:8013
    depends_on:
      - user-service
      - payment-service
    networks:
      - sentinel-net

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8013:8013"
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
